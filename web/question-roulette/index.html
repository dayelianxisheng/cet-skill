<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="从 CET-4 听力、作文、阅读和翻译等题型中随机选择下一项练习。">
  <title>CET-4 下一题型转盘</title>
  <link rel="stylesheet" href="styles.css?v=type-roulette-20261128">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../word-class-trainer/">
      <span class="brand-mark">?</span>
      <span><strong>CET-4</strong><small>下一题型转盘</small></span>
    </a>
    <a class="button ghost" href="../word-class-trainer/">进入选词填空</a>
  </header>

  <main>
    <section class="intro">
      <p class="eyebrow">NEXT QUESTION ROULETTE</p>
      <h1>下一题型，<br>交给转盘。</h1>
      <p>覆盖四级作文、听力、选词填空、长篇阅读、仔细阅读和翻译。每次随机决定一个专项。</p>
    </section>

    <section class="game" aria-labelledby="gameTitle">
      <div class="wheel-column">
        <h2 id="gameTitle" class="sr-only">选题转盘</h2>
        <div class="roulette-stage">
          <div class="roulette-pointer" aria-hidden="true"></div>
          <div id="rouletteWheel" class="roulette-wheel" aria-hidden="true"></div>
          <button id="spinBtn" class="roulette-spin" type="button">开始</button>
        </div>
      </div>

      <div class="decision-panel">
        <div class="current-card">
          <span>本轮范围</span>
          <strong>四级六大题型</strong>
        </div>
        <div>
          <p class="eyebrow">题型列表</p>
          <div id="candidateList" class="candidate-list" aria-label="可选题型"></div>
        </div>
        <p id="result" class="result" role="status" aria-live="polite">点击转盘中央的“开始”，决定下一项练习。</p>
        <div class="actions">
          <button id="spinAgainBtn" class="button ghost" type="button" hidden>再转一次</button>
          <a id="acceptBtn" class="button primary" href="#" hidden>进入训练</a>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js?v=type-roulette-20261128"></script>
</body>
</html>
